# Here is my docker-compose.yml 
version: '3.8'

services:
  scraper:
    build: .
    container_name: web_scraper
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      BASE_URL: "https://etrade.gov.et"
      SAVE_FREQUENCY: 1000
      S3_BUCKET_NAME: "kft-lakehouse-staging"
      S3_KEY: "evoucher_data/evoData/scraped_data_all.json"
      DATA_PATH: "/app/data/scraped_data_all.json"
      TIN_FILE_PATH: "/app/data/test.csv"
    volumes:
      - ./data:/app/data          # Persist data directory for input/output
      - ./output:/app/output       # Map output folder if needed for saved outputs
    restart: unless-stopped
